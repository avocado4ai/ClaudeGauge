; ============================================================
; ClaudeGauge v2 — Built on lcars-esp32 engine
; ============================================================

[platformio]
src_dir = src
build_dir = .pio/build

[env]
platform = espressif32@6.8.1
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

; Memory
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ;
    ; TFT_eSPI common
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_BACKLIGHT_ON=HIGH
    ;
    ; Font loading
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_GFXFF
    -DSMOOTH_FONT

lib_ldf_mode = deep
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.3.0
    https://github.com/dorofino/lcars-esp32.git

; ============================================================
; LILYGO T-Display-S3 (170x320, 8-bit parallel)
; ============================================================
[env:tdisplays3]
board = lilygo-t-display-s3
board_build.partitions = default_16MB.csv

build_flags =
    ${env.build_flags}
    -DBOARD_TDISPLAY_S3
    -DSCR_WIDTH=320
    -DSCR_HEIGHT=170
    ;
    ; TFT_eSPI parallel 8-bit
    -DINIT_SEQUENCE_3
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_PARALLEL_8_BIT

; ============================================================
; LILYGO T-Display-S3 — no-touch variant (TFT only, no CST816S)
; ============================================================
[env:tdisplays3_notouch]
board = lilygo-t-display-s3
board_build.partitions = default_16MB.csv

build_flags =
    ${env.build_flags}
    -DBOARD_TDISPLAY_S3_NOTOUCH
    -DSCR_WIDTH=320
    -DSCR_HEIGHT=170
    ;
    ; TFT_eSPI parallel 8-bit
    -DINIT_SEQUENCE_3
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_PARALLEL_8_BIT

; ============================================================
; Waveshare ESP32-C6-Touch-AMOLED-1.8 (368x448 portrait, QSPI SH8601)
; ============================================================
[env:c6amoled]
; pioarduino platform has proper ESP32-C6 Arduino support.
; espressif32@6.8.1 (inherited from [env]) is missing
; platformio-build-esp32c6.py and cannot build for this chip.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = waveshare_esp32c6_amoled18
board_build.psram = disabled
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
; Patch TFT_eSPI 2.5.43 so ESP32-C6 uses the RISC-V C3 processor path.
extra_scripts = pre:scripts/patch_tft_espi_c6.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ;
    ; TFT_eSPI common (shared font/driver flags)
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    ;
    ; Board identity and screen dimensions
    ; SH8601 does not support hardware rotation — use native portrait (368x448).
    -DBOARD_C6_AMOLED
    -DSCR_WIDTH=368
    -DSCR_HEIGHT=448
    -DTFT_WIDTH=368
    -DTFT_HEIGHT=448
    ;
    ; QSPI display pins (SH8601) for Arduino_GFX backend
    -DQSPI_LCD_CS=5
    -DQSPI_LCD_SCLK=0
    -DQSPI_LCD_D0=1
    -DQSPI_LCD_D1=2
    -DQSPI_LCD_D2=3
    -DQSPI_LCD_D3=4
    ;
    ; TFT_eSPI stub pins so lib compiles (display won't init via TFT_eSPI at runtime)
    ; DC/CS set to -1 so the C3 processor header emits empty no-op GPIO macros
    ; instead of GPIO.out_w1tc.val assignments that don't compile on C6.
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    -DTFT_MOSI=1
    -DTFT_SCLK=0
    -DTFT_MISO=-1
    -DTFT_BL=-1
    ;
    ; NOTE: To make TFT_eSPI use its RISC-V C3 processor path on C6 we
    ; patch the cached library files via the pre-build extra_script below
    ; (adding CONFIG_IDF_TARGET_ESP32C3 globally would break esp32-hal-cpu.c
    ; which uses it to pick the C3 ROM header — missing on C6).
    ;
    ; Smooth font support — needed by lcars-esp32's font rendering.
    ; Note: SMOOTH_FONT causes TFT_eSPI to define FS_NO_GLOBALS before FS.h
    ; is parsed, which would strip "using namespace fs;" and break WebServer.h.
    ; We work around this in main.cpp by including <FS.h> first (before lcars.h),
    ; so that "using namespace fs;" is already in scope when TFT_eSPI sets
    ; FS_NO_GLOBALS and re-includes FS.h (the include guard prevents re-processing).
    -DSMOOTH_FONT

lib_deps =
    ${env.lib_deps}

; ============================================================
; Waveshare ESP32-S3-LCD-1.47 (172x320, SPI)
; ============================================================
[env:waveshare147]
board = waveshare_esp32s3_lcd147

build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_147
    -DSCR_WIDTH=320
    -DSCR_HEIGHT=172
    ;
    ; TFT_eSPI SPI mode
    -DUSE_FSPI_PORT
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=320
    -DTFT_MOSI=45
    -DTFT_SCLK=40
    -DTFT_CS=42
    -DTFT_DC=41
    -DTFT_RST=39
    -DTFT_BL=48
    -DTFT_MISO=-1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=16000000
