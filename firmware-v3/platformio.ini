; ============================================================
; ClaudeGauge V3 — lcars-esp32 engine, ESP32-C6 AMOLED only
; ============================================================

[env:c6amoled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = waveshare_esp32c6_amoled
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DSCR_WIDTH=368
    -DSCR_HEIGHT=448
    -DUSE_ARDUINO_GFX
    -DXPOWERS_CHIP_AXP2101
    -DARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    moononournation/GFX Library for Arduino@^1.6.4
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO
    adafruit/Adafruit XCA9554@^1.0.0
    lewisxhe/XPowersLib@^0.2.8
    https://github.com/dorofino/lcars-esp32.git

; ============================================================
; LILYGO T-Display-S3 — shared base (170x320, 8-bit parallel, TFT_eSPI)
; Infrastructure only (board/display/input plumbing). screen_layouts_v3.h
; is still hardcoded to the 368x448 AMOLED canvas, so dashboard elements
; will draw at those coordinates on this 320x170 screen — mostly off-canvas
; — until a layout for this resolution is designed in the LCARS Designer.
; ============================================================
[tdisplays3_base]
platform = espressif32@6.8.1
board = lilygo-t-display-s3
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DSCR_WIDTH=320
    -DSCR_HEIGHT=170
    ;
    ; TFT_eSPI common
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    ;
    ; TFT_eSPI parallel 8-bit
    -DINIT_SEQUENCE_3
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_PARALLEL_8_BIT

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.3.0
    https://github.com/dorofino/lcars-esp32.git

[env:tdisplays3]
extends = tdisplays3_base
build_flags =
    ${tdisplays3_base.build_flags}
    -DBOARD_TDISPLAY_S3

[env:tdisplays3_notouch]
extends = tdisplays3_base
build_flags =
    ${tdisplays3_base.build_flags}
    -DBOARD_TDISPLAY_S3_NOTOUCH
