; ============================================================
; Common settings shared by all boards
; ============================================================
[env]
platform = espressif32@6.8.1
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

build_flags =
    ; USB Serial over CDC
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS

lib_deps =
    bblanchon/ArduinoJson@^7.3.0

; ============================================================
; Common TFT_eSPI settings (shared by ST7789 boards)
; ============================================================
[tft_common]
build_flags =
    -DBOARD_HAS_PSRAM
    ;
    ; === TFT_eSPI common ===
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_BACKLIGHT_ON=HIGH
    ;
    ; === Font loading ===
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; ============================================================
; LILYGO T-Display-S3 (170x320, 8-bit parallel)
; ============================================================
[env:tdisplays3]
board = lilygo-t-display-s3
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled

build_flags =
    ${env.build_flags}
    ${tft_common.build_flags}
    -DBOARD_TDISPLAY_S3
    -DSCR_WIDTH=320
    -DSCR_HEIGHT=170
    ;
    ; TFT_eSPI parallel 8-bit
    -DINIT_SEQUENCE_3
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_PARALLEL_8_BIT

lib_deps =
    ${env.lib_deps}
    ${tft_common.lib_deps}

; ============================================================
; Waveshare ESP32-S3-LCD-1.47 (172x320, SPI)
; ============================================================
[env:waveshare147]
board = waveshare_esp32s3_lcd147
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled

build_flags =
    ${env.build_flags}
    ${tft_common.build_flags}
    -DBOARD_WAVESHARE_147
    -DSCR_WIDTH=320
    -DSCR_HEIGHT=172
    ;
    ; TFT_eSPI SPI mode
    -DUSE_FSPI_PORT
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=320
    -DTFT_MOSI=45
    -DTFT_SCLK=40
    -DTFT_CS=42
    -DTFT_DC=41
    -DTFT_RST=39
    -DTFT_BL=48
    -DTFT_MISO=-1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=16000000

lib_deps =
    ${env.lib_deps}
    ${tft_common.lib_deps}

; ============================================================
; Waveshare ESP32-C6-Touch-AMOLED-1.8 (368x448 AMOLED, QSPI)
; ============================================================
[env:c6amoled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = waveshare_esp32c6_amoled

build_flags =
    ${env.build_flags}
    -DBOARD_C6_AMOLED
    -DSCR_WIDTH=368
    -DSCR_HEIGHT=448
    -DUSE_ARDUINO_GFX

lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@^1.6.4
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO
    adafruit/Adafruit XCA9554@^1.0.0
