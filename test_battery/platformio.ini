; ============================================================
; Battery test sketch for Waveshare ESP32-C6-Touch-AMOLED-1.8
; Minimal firmware to verify AXP2101 + battery operation
; SAFE: only configures charging, does NOT touch power rails
; ============================================================

[platformio]
boards_dir = ../firmware/boards

[env:c6_battery_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = waveshare_esp32c6_amoled
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DXPOWERS_CHIP_AXP2101
    -DDISABLE_ALL_LIBRARY_WARNINGS

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    adafruit/Adafruit BusIO
    adafruit/Adafruit XCA9554@^1.0.0
    lewisxhe/XPowersLib@^0.2.8
